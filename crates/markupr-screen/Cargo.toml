[package]
name = "markupr-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Screen video, system audio and microphone capture on the mach host clock (macOS)"

[dependencies]
serde = { version = "1", features = ["derive"] }
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-screen-capture-kit = "0.3"
objc2-core-audio-types = "0.3"

[dev-dependencies]
serde_json = "1"

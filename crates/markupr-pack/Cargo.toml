[package]
name = "markupr-pack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
markupr-core = { path = "../markupr-core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
